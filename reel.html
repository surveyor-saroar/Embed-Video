<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3x3 Facebook Reel Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      font-family: system-ui, -apple-system, sans-serif;
    }

    .card-3x3 {
      width: 100%;
      max-width: 440px;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.65);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card-3x3:hover {
      transform: translateY(-4px);
      box-shadow: 0 28px 60px rgba(0, 0, 0, 0.75);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #f9fafb;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .card-tag {
      font-size: 11px;
      background: rgba(250, 204, 21, 0.16);
      color: #facc15;
      padding: 3px 10px;
      border-radius: 999px;
    }

    /* ৩:৩ বর্গাকার ভিডিও ফ্রেম */
    .video-square {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 3;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .video-square .fb-post,
    .video-square .fb-post span,
    .video-square .fb-post iframe {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
    }
  </style>
</head>
<body>
  <!-- Facebook JavaScript SDK -->
  <div id="fb-root"></div>
  <script async defer crossorigin="anonymous"
    src="https://connect.facebook.net/bn_IN/sdk.js#xfbml=1&version=v27.0"></script>

  <!-- 3/3 কার্ড -->
  <div class="card-3x3">
    <div class="card-header">
      <span>Facebook Reel</span>
      <span class="card-tag">3:3 CARD</span>
    </div>

    <div class="video-square">
      <div class="fb-post"
           data-href="https://www.facebook.com/reel/1443055264646735"
           data-width="400"
           data-show-text="false">
      </div>
    </div>
  </div>
</body>
</html>
