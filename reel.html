<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facebook Reel Embed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 12px;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      font-family: system-ui, -apple-system, sans-serif;
    }

    .reel-wrapper {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>
  <!-- Facebook JavaScript SDK -->
  <div id="fb-root"></div>
  <script async defer crossorigin="anonymous"
    src="https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v27.0"></script>

  <!-- Embedded Facebook Reel -->
  <div class="reel-wrapper">
    <div class="fb-post"
         data-href="https://www.facebook.com/reel/1443055264646735"
         data-width="500"
         data-show-text="true">
    </div>
  </div>
</body>
</html>
