<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Dual Scene Reel Cards (3:3 Left Still + 3:2 Enter)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: radial-gradient(circle at top, #1e293b, #090d16);
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: auto;
    }

    /* দুটি কার্ড পাশাপাশি রাখার কন্টেইনার */
    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 1120px;
      transition: all 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .reel-card {
      flex-shrink: 0;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }

    /* প্রথম কার্ড: 3/3 */
    .card-scene-1 {
      width: 100%;
      max-width: 390px;
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.4s ease,
                  box-shadow 0.4s ease;
    }

    /* ৫ সেকেন্ড পর একটু বামে সরে স্টিল থাকবে */
    .card-scene-1.shifted-left {
      transform: translateX(-14px);
      border-color: rgba(56, 189, 248, 0.45);
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.75);
    }

    /* দ্বিতীয় কার্ড: 3/2 (শুরুতে লুকানো, পরে পপ-আপে প্রবেশ করবে) */
    .card-scene-2 {
      display: none;
      width: 100%;
      max-width: 540px;
      border-color: rgba(250, 204, 21, 0.45);
      box-shadow: 0 28px 65px rgba(0, 0, 0, 0.8), 0 0 28px rgba(250, 204, 21, 0.2);
    }

    .card-scene-2.active {
      display: block;
      animation: popEnterRight 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes popEnterRight {
      0% {
        opacity: 0;
        transform: scale(0.76) translateX(45px);
      }
      70% {
        opacity: 1;
        transform: scale(1.03) translateX(-4px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateX(0);
      }
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #f9fafb;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .status-pill {
      font-size: 11px;
      background: rgba(250, 204, 21, 0.16);
      color: #facc15;
      padding: 3px 10px;
      border-radius: 999px;
      user-select: none;
    }

    .status-pill.still-pill {
      background: rgba(56, 189, 248, 0.18);
      color: #38bdf8;
    }

    .video-square {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 3;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .video-3x2 {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 2;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .video-square .fb-post,
    .video-square .fb-post span,
    .video-square .fb-post iframe,
    .video-3x2 .fb-post,
    .video-3x2 .fb-post span,
    .video-3x2 .fb-post iframe {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
    }

    @media (max-width: 900px) {
      .stage {
        flex-direction: column;
      }
      .card-scene-1.shifted-left {
        transform: translateX(0);
      }
    }
  </style>
</head>
<body>
  <!-- Facebook JavaScript SDK -->
  <div id="fb-root"></div>
  <script async defer crossorigin="anonymous"
    src="https://connect.facebook.net/bn_IN/sdk.js#xfbml=1&version=v27.0"></script>

  <div class="stage" id="stage">
    <!-- প্রথম সিন কার্ড (3/3) -->
    <div class="reel-card card-scene-1" id="cardScene1">
      <div class="card-header">
        <span>Scene 1 • 3/3 Card</span>
        <span class="status-pill" id="pillScene1">RUNNING (5s)</span>
      </div>
      <div class="video-square">
        <div class="fb-post"
             data-href="https://www.facebook.com/reel/1443055264646735"
             data-width="400"
             data-show-text="false"
             data-autoplay="true">
        </div>
      </div>
    </div>

    <!-- দ্বিতীয় সিন কার্ড (3/2) -->
    <div class="reel-card card-scene-2" id="cardScene2">
      <div class="card-header">
        <span>Scene 2 • 3/2 Card</span>
        <span class="status-pill" id="pillScene2">POP-UP 3:2</span>
      </div>
      <div class="video-3x2">
        <div class="fb-post"
             data-href="https://www.facebook.com/reel/1443055264646735"
             data-width="520"
             data-show-text="false"
             data-autoplay="true">
        </div>
      </div>
    </div>
  </div>

  <script>
    const cardScene1 = document.getElementById("cardScene1");
    const cardScene2 = document.getElementById("cardScene2");
    const pillScene1 = document.getElementById("pillScene1");

    const SCENE_1_DURATION = 5000; // ৫ সেকেন্ড

    let audioCtx = null;

    function initAudio() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
      } catch (_) {}
    }

    function playPopSound() {
      initAudio();
      if (!audioCtx || audioCtx.state !== "running") return;

      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.exponentialRampToValueAtTime(640, now + 0.14);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.14, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.19);
      } catch (_) {}
    }

    function runSimultaneousTransition() {
      // প্রথম কার্ড একটু বামে সরে স্ক্রিনে স্টিল থাকবে
      cardScene1.classList.add("shifted-left");
      pillScene1.textContent = "STILL LEFT";
      pillScene1.classList.add("still-pill");

      // সাথে সাথে দ্বিতীয় কার্ড (3/2) পপ-আপ সাউন্ডসহ প্রবেশ করবে ও উভয় একসাথে রান করবে
      cardScene2.classList.add("active");
      playPopSound();

      // নতুন যুক্ত হওয়া XFBML এলিমেন্ট রেন্ডার করার চেষ্টা
      if (window.FB && window.FB.XFBML && typeof window.FB.XFBML.parse === "function") {
        window.FB.XFBML.parse(cardScene2);
      }
    }

    window.addEventListener("load", () => {
      initAudio();

      setTimeout(() => {
        runSimultaneousTransition();
      }, SCENE_1_DURATION);
    });
  </script>
</body>
</html>
