<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto 2-Scene Reel Card (3:3 -> 5:2)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: radial-gradient(circle at top, #1e293b, #090d16);
      font-family: system-ui, -apple-system, sans-serif;
    }

    .reel-card {
      width: 100%;
      max-width: 440px;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      transition: max-width 0.45s ease, box-shadow 0.35s ease, border-color 0.35s ease;
    }

    /* দ্বিতীয় সিন: চওড়া 5:2 কার্ড */
    .reel-card.mode-5x2 {
      max-width: 720px;
      border-color: rgba(250, 204, 21, 0.45);
      box-shadow: 0 28px 65px rgba(0, 0, 0, 0.8), 0 0 28px rgba(250, 204, 21, 0.2);
    }

    /* পপ-আপ ট্রানজিশন অ্যানিমেশন */
    .pop-transition {
      animation: popUpReveal 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes popUpReveal {
      0% {
        opacity: 0;
        transform: scale(0.75) translateY(24px);
      }
      70% {
        opacity: 1;
        transform: scale(1.03) translateY(-4px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #f9fafb;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .status-pill {
      font-size: 11px;
      background: rgba(250, 204, 21, 0.16);
      color: #facc15;
      padding: 3px 10px;
      border-radius: 999px;
      user-select: none;
    }

    /* ভিডিও ফ্রেম: প্রথম ৩ সেকেন্ড 3/3, এরপর 5/2 */
    .video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 3;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: aspect-ratio 0.45s ease;
    }

    .video-frame.ratio-5x2 {
      aspect-ratio: 5 / 2;
    }

    .video-frame .fb-post,
    .video-frame .fb-post span,
    .video-frame .fb-post iframe {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
    }
  </style>
</head>
<body>
  <!-- Facebook JavaScript SDK -->

  <div class="reel-card" id="reelCard">

      <div class="fb-post"

           data-width="500"
           data-show-text="false"
           data-autoplay="true">
      </div>
    </div>
  </div>
